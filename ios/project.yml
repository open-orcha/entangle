name: Entangle
options:
  bundleIdPrefix: io.openorcha
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # No team is set on purpose: the simulator build needs no signing.
    DEVELOPMENT_TEAM: ""
targets:
  Entangle:
    type: application
    platform: iOS
    sources:
      - path: Entangle
      # The content contract shared with the Android and web apps.
      - path: ../content/lessons.json
        buildPhase: resources
    info:
      path: Entangle/Info.plist
      properties:
        CFBundleDisplayName: Entangle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.openorcha.entangle
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Entangle:
    build:
      targets:
        Entangle: all
    run:
      config: Debug
